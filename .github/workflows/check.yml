name: 检查发布候选
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check_git_large_files.py
      - run: git diff --exit-code -- main.js
